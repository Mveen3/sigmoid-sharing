<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mveen File Share</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Top Navigation Header -->
    <header class="header">
        <div class="header-container">
            <a href="/" class="logo-group">
                <div class="logo-icon">⚡</div>
                <div class="logo-text">
                    <h1>Mveen File Share</h1>
                </div>
            </a>

            <!-- Navigation Actions -->
            <div class="nav-actions">
                <button class="btn-action-small" id="btn-change-password" title="Change account password">
                    Change Password
                </button>
                <button class="btn-icon" id="btn-refresh" title="Refresh Directory">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
                <button class="btn-icon" id="btn-logout" title="Sign Out">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="main-wrapper">
        <!-- Breadcrumb & Control Toolbar -->
        <div class="path-toolbar">
            <div class="breadcrumbs" id="breadcrumbs-container">
                <span class="crumb-item active">Home</span>
            </div>

            <div class="controls-group">
                <!-- Live Search Box -->
                <div class="search-box">
                    <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    <input type="text" id="filter-input" class="search-input" placeholder="Filter files...">
                </div>

                <button class="btn-action-small" id="btn-new-folder" type="button">New Folder</button>
                <button class="btn-action-small" id="btn-upload" type="button">Upload Files</button>
                <input id="upload-input" type="file" multiple hidden>
                <label class="hidden-toggle" for="show-hidden-toggle">
                    <input id="show-hidden-toggle" type="checkbox">
                    Show hidden files
                </label>

                <!-- Sort Dropdown -->
                <select id="sort-select" class="sort-select" aria-label="Sort by">
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                    <option value="size-desc">Size (Largest)</option>
                    <option value="size-asc">Size (Smallest)</option>
                    <option value="date-desc">Modified (Newest)</option>
                    <option value="date-asc">Modified (Oldest)</option>
                </select>

                <!-- View Toggle (List vs Grid) -->
                <div class="btn-toggle-view">
                    <button class="view-btn active" id="view-list-btn" title="List View">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <button class="view-btn" id="view-grid-btn" title="Grid View">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                        </svg>
                    </button>
                </div>

                <!-- Select All / None Toggle -->
                <button class="btn-action-small" id="btn-select-all" title="Select all items">
                    <span>Select All</span>
                </button>
            </div>
        </div>

        <!-- Directory Items List / Grid Container -->
        <div id="items-root" class="items-container">
            <!-- Dynamic items rendered by app.js -->
        </div>
    </main>

    <!-- Floating Multi-Select Action Bar -->
    <div class="floating-bar" id="selection-bar">
        <div class="select-count-badge">
            <span class="badge-pill" id="selected-count">0</span>
            <span id="selected-size-text">items selected</span>
        </div>
        <div class="bar-buttons">
            <button class="btn-glow" id="btn-parallel-dl" title="Download selected files simultaneously">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
                <span>Parallel Download</span>
            </button>
            <button class="btn-secondary" id="btn-zip-dl" title="Stream all selected files as a single ZIP archive">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
                <span>Download ZIP</span>
            </button>
            <button class="btn-secondary" id="btn-clear-selection" title="Clear selection">
                <span>✕</span>
            </button>
        </div>
    </div>

    <!-- File Preview Modal -->
    <div class="modal-overlay" id="preview-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="preview-title">File Preview</h3>
                <button class="modal-close" id="preview-close">&times;</button>
            </div>
            <div class="modal-body" id="preview-body">
                <!-- Preview injected here -->
            </div>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div class="modal-overlay" id="password-modal">
        <div class="modal-content" style="max-width: 520px;">
            <div class="modal-header">
                <h3 class="modal-title">Change Password</h3>
                <button class="modal-close" id="password-close" type="button">&times;</button>
            </div>
            <div class="modal-body">
                <form id="password-form" class="settings-form">
                    <label for="current-password">Current password</label>
                    <input class="settings-input" id="current-password" name="currentPassword" type="password" autocomplete="current-password" required>
                    <label for="new-password">New password</label>
                    <input class="settings-input" id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="8" required>
                    <label for="confirm-password">Confirm new password</label>
                    <input class="settings-input" id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
                    <p id="password-message" class="form-message" role="status"></p>
                    <button class="btn-submit" type="submit">Update Password</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Parallel Download Progress Drawer -->
    <div class="download-drawer" id="dl-drawer">
        <div class="drawer-header">
            <span>⚡ Parallel Downloads</span>
            <span id="dl-drawer-stats">0/0</span>
        </div>
        <div class="drawer-items-list" id="dl-items-list">
            <!-- Progress bars -->
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
